# グローバル設定（すべてのブロックに適用される共通ルール）
# スクリプトが置かれているデフォルトのパス（Gentoo等の標準パス）
command=/usr/libexec/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none

# --- ここから下がツールバーに表示されるモジュール ---

# 1. ディスク空き容量
[disk]
label=Disk: 
interval=30

# 2. メモリ使用量
[memory]
label=MEM: 
interval=10

# 3. CPU使用率
[cpu_usage]
label=CPU: 
interval=5
min_width=CPU: 100.00%

# 4. ネットワーク接続状況 (有線/無線)
[iface]
label=IP: 
interval=10

# 5. 音量（スクリプトを使わず直接コマンドを書くこともできます）
[volume]
label=音量: 
# amixerコマンドで現在の音量を取得して表示する例
command=amixer get Master | grep -E -o '[0-9]{1,3}?%' | head -1
interval=1
signal=10

[battery]
command=~/.config/sway/battery.sh
interval=60

[wifi]
label=Wifi:
command=STR=$(nmcli -t -f active,signal dev wifi 2>/dev/null | grep '^yes' | cut -d':' -f2 | head -n 1); [ -n "$STR" ] && echo "${STR}%" || echo "接続なし"
interval=30

# 6. 時計（直接 date コマンドを実行する例）
[time]
label= 
command=date '+%Y年%m月%d日(%a) %H:%M:%S'
interval=1

